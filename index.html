<html lang="en" class="dark">

    <title>API Studio</title>
    <script>
      try {
        const stored = JSON.parse(localStorage.getItem("api-studio") ?? "{}");

          document.documentElement.classList.remove("dark");
        }
      } catch {}
    </script>
